<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
</head>

<body>

    <h1>Simple Calculator</h1>

    <input type="number" id="num1" placeholder="첫 번째 숫자">
    <input type="number" id="num2" placeholder="두 번째 숫자">

    <button onclick="add()">더하기</button>
    <button onclick="subtract()">빼기</button>
    <button onclick="multiply()">곱하기</button>
    <button onclick="divide()">나누기</button>

    <h2>결과: <span id="result">0</span></h2>

    <script src="script.js"></script>

</body>
</html>
